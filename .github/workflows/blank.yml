name: Publish Windows release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set release version
        shell: pwsh
        run: |
          $version = "0.2.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run package:win

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $installer = "release/GrafikPro-Setup-$env:VERSION-x64.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release/latest.yml"
          foreach ($file in @($installer, $blockmap, $metadata)) {
            if (-not (Test-Path $file)) {
              throw "Required release file is missing: $file"
            }
          }
          gh release create "v$env:VERSION" $installer $blockmap $metadata `
            --title "$env:VERSION" `
            --notes "Automatyczne wydanie GrafikPro $env:VERSION" `
            --target $env:GITHUB_SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
